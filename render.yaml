# Render Blueprint for the self-contained Kalyani Enterprises deployment.
# This file is at the repository root and is the Blueprint Path:
# render.yaml

services:
  - type: web
    name: kalyanienterprises
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    domains:
      - kalyanienterprises.com
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_FALLBACK_TO_SQLITE
        value: "false"
      - key: SEED_ON_STARTUP
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
