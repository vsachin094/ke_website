name: Keep Render service responsive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check production health endpoint
        run: curl --fail --silent --show-error --max-time 30 https://www.kalyanienterprises.com/health
