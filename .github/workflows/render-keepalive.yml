name: Keep Website Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  keep_alive:
    runs-on: ubuntu-latest

    steps:
      - name: Open website every 10 minutes
        run: |
          curl -L --fail --silent --show-error \
            --max-time 30 \
            https://www.kalyanienterprises.com > /dev/null
